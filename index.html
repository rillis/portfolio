<!DOCTYPE html>
<html lang="pt-BR" dir="ltr" class="scroll-smooth">
  <head>
    <meta charset="utf-8">
    <title>Rillis | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="js/tailwind.js"></script>
    <link rel="icon" type="image/x-icon" href="img/favicon2.ico">
  </head>
  <body class="bg-gray-900 text-gray-100 font-sans selection:bg-blue-500 selection:text-white">

    <div class="min-h-screen flex flex-col">
        <nav class="p-6 max-w-6xl mx-auto w-full flex justify-start items-center">
            <a href="https://rillis.com.br" class="text-gray-400 hover:text-emerald-400 transition-colors flex items-center gap-2 font-medium">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                Home
            </a>
        </nav>

        <header class="flex-grow flex flex-col justify-center items-center text-center px-6 pb-20">
            <h1 class="text-5xl md:text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 mb-6 tracking-tight">
                Portfólio
            </h1>
            <p class="text-lg md:text-xl text-gray-400 mb-12 max-w-2xl">
                Meus projetos, experimentos e repositórios do GitHub.
            </p>
            
            <a href="#portfolio-container" class="animate-bounce p-3 bg-gray-800 rounded-full text-blue-400 hover:text-emerald-400 hover:bg-gray-700 transition-all duration-300 shadow-lg border border-gray-700">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path></svg>
            </a>
        </header>
    </div>

    <main id="portfolio-container" class="max-w-6xl mx-auto w-full px-6 py-16 min-h-screen flex flex-col">
        <div id="portfolio" class="flex-grow">
            </div>
    </main>

    <footer class="py-6 border-t border-gray-800 text-center text-gray-500 text-sm">
        Made by Rillis © 2022 - <span id="ano-atual"></span>
    </footer>

    <script src="js/master.js"></script>
    <script>
        document.getElementById('ano-atual').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
